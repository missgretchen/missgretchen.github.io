<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pixelcloud.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gretchen Eggers - Portfolio</title>
    <meta name="description" content="Creative portfolio and professional profile of Gretchen Eggers" />
    <script>
      // GitHub Pages SPA redirect handler:
      // decodes `?p=/route` from 404.html back into a real browser path.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
